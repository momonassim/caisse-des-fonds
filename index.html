<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caisse des fonds</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse des fonds">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF0F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F1; --ink:#1B2126; --soft:#7B858D; --line:#D5DADD;
  --brick:#E6D4A3; --brick2:#DFCB98; --brick3:#E9DAB0; --soot:#5A4E3C; --joint:#C4AE78; --hole:#3A332A; --count:#F6D36B; --countJoint:#C99A12;
  --steel:#4B525B; --steelLine:#1B1E23; --steelEdge:#6A737D; --shell:#3A4047;
  --pal:#F2C200; --palDark:#8A6E00; --cable:#2B2E33;
  --sand:#6B665F; --grain:#9A938A; --field:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B; --ink:#ECEFF1; --soft:#8A949B; --line:#2A3136;
  --brick:#8F8160; --brick2:#887A59; --brick3:#958767; --soot:#2A241B; --joint:#5E5440; --hole:#1E1A15; --count:#E3B530; --countJoint:#9C7A10;
  --steel:#566069; --steelLine:#0E1012; --steelEdge:#7A848E; --shell:#454C54;
  --pal:#E8B800; --palDark:#6E5800; --cable:#A9B0B6;
  --sand:#5A564F; --grain:#857E74; --field:#1E2428; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14181B; --ink:#ECEFF1; --soft:#8A949B; --line:#2A3136;
  --brick:#8F8160; --brick2:#887A59; --brick3:#958767; --soot:#2A241B; --joint:#5E5440; --hole:#1E1A15; --count:#E3B530; --countJoint:#9C7A10;
  --steel:#566069; --steelLine:#0E1012; --steelEdge:#7A848E; --shell:#454C54;
  --pal:#E8B800; --palDark:#6E5800; --cable:#A9B0B6;
  --sand:#5A564F; --grain:#857E74; --field:#1E2428; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:all .3s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:18px 20px 16px;gap:14px}
.piece{display:flex;align-items:center;justify-content:space-between;background:var(--field);border-radius:16px;padding:12px 16px}
.piece label{font-size:16px;color:var(--soft)}
.piece .in{display:flex;align-items:baseline;gap:6px}
.piece input{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:700;width:3.2em;text-align:right;
  border:none;background:transparent;color:var(--ink);padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.piece input::-webkit-outer-spin-button,.piece input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.piece input:focus{outline:none}
.piece:focus-within{box-shadow:0 0 0 2px var(--count)}
.piece span{color:var(--soft);font-size:16px}
input[type=range]{width:100%;margin:0;accent-color:var(--count);height:26px}
.stage{flex:1;min-height:0;position:relative}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
svg text{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.mv{transition:transform .4s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.mv{transition:none}}
.note{margin:0;text-align:center;font-size:17px;color:var(--soft);line-height:1.3;height:2.9em;display:flex;align-items:center;justify-content:center;flex:none}
.note b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;color:var(--ink);font-weight:700;vertical-align:-3px;margin:0 2px}
</style>
</head>
<body>
<main>
  <div class="piece">
    <label for="hNum">Pièce</label>
    <span class="in"><input id="hNum" type="number" inputmode="numeric" min="1000" max="4300" value="3000"><span>mm</span></span>
  </div>
  <input id="h" type="range" min="1000" max="4300" step="100" value="3000" aria-label="Hauteur de la pièce">
  <div class="stage"><svg id="svg" viewBox="0 0 340 590" role="img" aria-label="Alvéole vue de côté"></svg></div>
  <p class="note" id="note">Descendre le haut du palonnier de <b>13</b> briques</p>
</main>
<div id="toast"></div>
<script>
(function(){
  var ROWS=50, FREE=7, CAISSE=24, U=10, BL=36;            // BL = longueur d'une brique vue de côté (≈ 640 × 180 mm)
  var TOP=70, FLOOR=TOP+ROWS*U, WL=40, EW=14, IN=WL+EW, W=258, WR=IN+W, CX=IN+W/2;
  var NS="http://www.w3.org/2000/svg", svg=document.getElementById('svg');
  function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a){var v=a[k];
    if((k==='fill'||k==='stroke')&&String(v).indexOf('var(')===0)e.style[k]=v;else e.setAttribute(k,v);}
    (p||svg).appendChild(e);return e;}
  svg.setAttribute('viewBox','0 0 '+(WR+EW+8)+' '+(FLOOR+14));
  function rnd(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
  var TONES=['var(--brick)','var(--brick2)','var(--brick3)'];

  var defs=el('defs',{});
  var clip=el('clipPath',{id:'inner'},defs); el('rect',{x:IN,y:TOP,width:W,height:ROWS*U},clip);
  var pat=el('pattern',{id:'grain',width:7,height:7,patternUnits:'userSpaceOnUse'},defs);
  el('rect',{width:7,height:7,fill:'var(--sand)'},pat);
  [[1.5,1.5,1],[5,4.5,.8],[3,6.2,.6],[6,1,.5]].forEach(function(c){el('circle',{cx:c[0],cy:c[1],r:c[2],fill:'var(--grain)'},pat);});

  // mur du fond (la cloison vue de face) : 5 courses du haut empilées, dessous en quinconce
  var back=el('g',{'clip-path':'url(#inner)'}), rows=[];
  for(var r=0;r<ROWS;r++){
    var y=TOP+r*U, off=(r<5)?0:((r%2)?BL/2:0), list=[];
    for(var x=IN-off;x<WR;x+=BL){
      var tone=TONES[Math.floor(rnd(r*31.7+x*.37)*3)];
      var b=el('rect',{x:x,y:y,width:BL,height:U,fill:tone,stroke:'var(--joint)','stroke-width':.7},back);
      b._tone=tone; list.push(b);
      if(rnd(r*5.3+x*1.1)>0.9) el('path',{d:'M'+(x+BL*0.3)+' '+(y+1.5)+' l2 3 l-1 4',fill:'none',stroke:'var(--joint)','stroke-width':.6},back);
    }
    rows.push(list);
  }
  // ombre légère pour que le mur du fond reste derrière
  el('rect',{x:IN,y:TOP,width:W,height:ROWS*U,fill:'#000',opacity:.06});
  el('line',{x1:IN,x2:WR,y1:TOP+5*U,y2:TOP+5*U,stroke:'var(--hole)','stroke-width':1.2,opacity:.7});

  var sand=el('rect',{x:IN,width:W,fill:'url(#grain)'});
  var sandTopLine=el('line',{x1:IN,x2:WR,stroke:'var(--grain)','stroke-width':2});

  // murs de bout, coupés : brique avec son trou vertical
  var ends=[];
  function endBrick(x,y,i){
    var tone=TONES[Math.floor(rnd(i*7.3+x)*3)];
    var b=el('rect',{x:x,y:y,width:EW,height:U,fill:tone,stroke:'var(--joint)','stroke-width':.7}); b._tone=tone;
    var hw=EW*0.56,hx=x+(EW-hw)/2;
    el('rect',{x:hx,y:y+.9,width:hw,height:U-1.8,rx:1.4,fill:'var(--hole)'});
    el('rect',{x:hx,y:y+.9,width:1.2,height:U-1.8,fill:'var(--soot)'});
    return b;
  }
  for(var r=0;r<ROWS;r++){var y=TOP+r*U; ends.push([endBrick(WL,y,r),endBrick(WR,y,r+1)]);}
  [WL,WR].forEach(function(x){el('line',{x1:x-1,x2:x+EW+1,y1:TOP+5*U,y2:TOP+5*U,stroke:'var(--hole)','stroke-width':1.3});});
  el('rect',{x:WL-4,y:FLOOR,width:WR+EW-WL+8,height:6,fill:'var(--joint)'});
  for(var i=5;i<=ROWS;i+=5){var t=el('text',{x:WL-5,y:TOP+i*U-1.5,'text-anchor':'end','font-size':11,style:'fill:var(--soft)'});t.textContent=i;}

  // ---- palonnier + caisse des fonds, vue de côté (origine = haut du palonnier) ----
  var g=el('g',{'class':'mv'});
  var cL=IN+12, cR=WR-12, cW=cR-cL;
  // moufle et brins du pont
  el('line',{x1:CX-5,y1:-900,x2:CX-5,y2:-30,stroke:'var(--cable)','stroke-width':1.3},g);
  el('line',{x1:CX+5,y1:-900,x2:CX+5,y2:-30,stroke:'var(--cable)','stroke-width':1.3},g);
  el('rect',{x:CX-12,y:-34,width:24,height:14,rx:3,fill:'var(--cable)'},g);
  el('path',{d:'M'+CX+' -20 v8 a6 6 0 1 1 -6 6',fill:'none',stroke:'var(--cable)','stroke-width':2.6,'stroke-linecap':'round'},g);
  el('rect',{x:CX-6,y:-5,width:12,height:7,rx:2.5,fill:'none',stroke:'var(--palDark)','stroke-width':2.2},g);
  // palonnier (épais)
  el('rect',{x:cL-4,y:2,width:cW+8,height:58,rx:3,fill:'var(--pal)',stroke:'var(--palDark)','stroke-width':1.2},g);
  el('rect',{x:cL+2,y:8,width:cW-4,height:46,rx:2,fill:'none',stroke:'var(--palDark)','stroke-width':.8,opacity:.6},g);
  [cL+cW*0.33,cL+cW*0.67].forEach(function(x){el('line',{x1:x,y1:8,x2:x,y2:54,stroke:'var(--palDark)','stroke-width':.8,opacity:.6},g);});
  // bras dans les fentes
  [cL+18,cR-26].forEach(function(x){el('rect',{x:x,y:60,width:8,height:13,fill:'var(--pal)',stroke:'var(--palDark)','stroke-width':.8},g);});
  // feux tricolores à la verticale
  el('rect',{x:cL+8,y:13,width:12,height:36,rx:2,fill:'var(--cable)'},g);
  [['#D33A2C',20],['#F0B323',31],['#2FA84F',42]].forEach(function(v){el('circle',{cx:cL+14,cy:v[1],r:3.6,fill:v[0]},g);});
  // tube de la tige (bout +Y)
  el('rect',{x:cR-40,y:-3,width:7,height:5,fill:'var(--palDark)'},g);
  // caisse
  var y0=69, y1=236, y3=240;
  el('rect',{x:cL,y:y0,width:cW,height:y3-y0,fill:'var(--steel)',stroke:'var(--steelLine)','stroke-width':1.2},g);
  [cL+18,cR-26].forEach(function(x){el('rect',{x:x-1,y:y0,width:10,height:7,fill:'var(--hole)'},g);});
  el('rect',{x:cL,y:y0,width:5,height:y3-y0,fill:'var(--steelEdge)'},g);
  el('rect',{x:cR-5,y:y0,width:5,height:y3-y0,fill:'var(--steelEdge)'},g);
  el('rect',{x:cL,y:y0,width:cW,height:3,fill:'var(--steelEdge)'},g);
  [0.25,0.5,0.75].forEach(function(f){el('rect',{x:cL+cW*f-1.5,y:y0+8,width:3,height:y1-y0-20,fill:'var(--steelEdge)',opacity:.7},g);});
  // fenêtre encadrée + tige + cale blanche
  el('rect',{x:cR-45,y:82,width:17,height:32,fill:'var(--hole)',stroke:'var(--steelEdge)','stroke-width':2},g);
  el('rect',{x:cR-38,y:76,width:3,height:42,fill:'#EDEDE8'},g);
  el('rect',{x:cR-43,y:117,width:13,height:3,fill:'#EDEDE8'},g);
  var n4=el('text',{x:cL+40,y:160,'text-anchor':'middle','font-size':34,'font-weight':700,style:'fill:#EDEDE8;opacity:.9'},g);n4.textContent='4';
  el('rect',{x:cL,y:y1-10,width:cW,height:4,fill:'var(--steelEdge)'},g);
  // trappe plate sur toute la longueur
  el('rect',{x:cL+2,y:y1,width:cW-4,height:y3-y1,fill:'var(--shell)',stroke:'var(--steelLine)','stroke-width':.8},g);

  // repère : trait jaune + pastille à gauche
  var m=el('g',{'class':'mv'});
  el('line',{x1:WL,y1:0,x2:WR+EW,y2:0,stroke:'var(--count)','stroke-width':2.5,'stroke-linecap':'round'},m);
  el('rect',{x:2,y:-11,width:32,height:22,rx:11,fill:'var(--count)'},m);
  var pill=el('text',{x:18,y:6,'text-anchor':'middle','font-size':17,'font-weight':700,style:'fill:#1B2126'},m);

  var range=document.getElementById('h'), num=document.getElementById('hNum'), note=document.getElementById('note');
  function update(h){
    var pB=Math.round(h/100);
    var D=FREE+pB-CAISSE;              // 3000 → 13 ; ±100 mm = ±1 brique
    var fond=ROWS-D-CAISSE;
    for(var r=0;r<ROWS;r++){var on=r<D;
      rows[r].forEach(function(b){b.style.fill=on?'var(--count)':b._tone;b.style.stroke=on?'var(--countJoint)':'var(--joint)';});
      ends[r].forEach(function(b){b.style.fill=on?'var(--count)':b._tone;b.style.stroke=on?'var(--countJoint)':'var(--joint)';});}
    var y=TOP+D*U;
    g.setAttribute('transform','translate(0,'+y+')');
    m.setAttribute('transform','translate(0,'+y+')');
    sand.setAttribute('y',FLOOR-fond*U); sand.setAttribute('height',Math.max(0,fond)*U);
    sandTopLine.setAttribute('y1',FLOOR-fond*U+1); sandTopLine.setAttribute('y2',FLOOR-fond*U+1);
    pill.textContent=Math.abs(D);
    note.innerHTML=D>=0
      ? 'Descendre le haut du palonnier de <b>'+D+'</b>'+(D>1?' briques':' brique')
      : 'Le palonnier reste <b>'+(-D)+'</b>'+(D<-1?' briques':' brique')+' au-dessus de la chambre';
  }
  function setH(v,from){v=Math.round(Number(v));if(!isFinite(v))return;
    var c=Math.min(4300,Math.max(1000,v));
    if(from!=='range')range.value=Math.round(c/100)*100; if(from!=='num')num.value=c;
    update(c); try{localStorage.setItem('caisseFonds.h3',String(c));}catch(e){}}
  range.addEventListener('input',function(){setH(range.value,'range');});
  num.addEventListener('input',function(){if(num.value!==''&&Number(num.value)>=1000)setH(num.value,'num');});
  num.addEventListener('change',function(){setH(num.value||3000);});
  var s0=3000;try{var s=localStorage.getItem('caisseFonds.h3');if(s)s0=Number(s)||3000;}catch(e){}
  setH(s0);
})();
/* Installation et mises à jour */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(function(reg){
    function propose(sw){var t=document.getElementById("toast");
      t.textContent="Nouvelle version disponible · toucher pour mettre à jour";
      t.style.pointerEvents="auto"; t.classList.add("on"); t.onclick=function(){sw.postMessage("maj");};}
    if (reg.waiting && navigator.serviceWorker.controller) propose(reg.waiting);
    reg.addEventListener("updatefound",function(){var n=reg.installing;
      n.addEventListener("statechange",function(){ if(n.state==="installed"&&navigator.serviceWorker.controller) propose(n); });});
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) reg.update(); });
  });
  var recharge=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(!recharge){recharge=true;location.reload();} });
}
</script>
</body>
</html>
